apiVersion: v1
kind: ConfigMap
metadata:
  name: gestao-compras-config
data:
  ENVIRONMENT: "production"
  STORAGE_TYPE: "s3"
  S3_REGION: "us-east-1"
  APP_NAME: "Sistema Gestao Compras"
  API_V1_PREFIX: "/api/v1"
---
apiVersion: v1
kind: Secret
metadata:
  name: gestao-compras-secrets
type: Opaque
data:
  DATABASE_URL: "base64_encoded_url"
  REDIS_URL: "base64_encoded_url"
  SECRET_KEY: "base64_encoded_key"
  GROQ_API_KEY: "base64_encoded_key"
  GEMINI_API_KEY: "base64_encoded_key"
  S3_BUCKET: "base64_encoded_name"
  S3_ACCESS_KEY: "base64_encoded_key"
  S3_SECRET_KEY: "base64_encoded_key"
